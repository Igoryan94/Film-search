plugins {
    alias(libs.plugins.androidApplication)
    alias(libs.plugins.jetbrainsKotlinAndroid)
    id 'kotlin-parcelize'
    id 'com.google.devtools.ksp'

    // Применяем плагин Google Services
    id 'com.google.gms.google-services'
}
apply from: "$project.rootDir/versions.gradle"

android {
    namespace 'com.igoryan94.filmsearch'
    compileSdk 34

    defaultConfig {
        applicationId "com.igoryan94.filmsearch"
        minSdk 31
        targetSdk 34
        versionCode 1
        versionName "1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    kotlinOptions {
        jvmTarget = '1.8'
    }
    buildFeatures {
        viewBinding = true
        dataBinding = true // Устаревшее, теперь не используется -
        //  компании предпочитают JetPack Compose либо ViewBinding
        buildConfig = true // Форсирование создания BuildConfig, для определения типа билда -
        //  релизный или отладочный.
    }

    // Определяем измерение для типов подписки
    flavorDimensions += "version"

    productFlavors {
        free {
            dimension "version"
            applicationIdSuffix ".free"
            versionNameSuffix "-free"
            // Переменная для проверки типа версии в коде
            buildConfigField "boolean", "IS_PRO", "false"
        }
        pro {
            dimension "version"
            applicationIdSuffix ".pro"
            versionNameSuffix "-pro"
            buildConfigField "boolean", "IS_PRO", "true"
        }
    }
}

dependencies {
    // Модуль: remote_module
    implementation project(":remote_module")

    implementation libs.androidx.core.ktx
    implementation libs.androidx.appcompat
    implementation libs.material
    implementation libs.androidx.activity
    implementation libs.androidx.constraintlayout
    implementation libs.androidx.viewpager2
    implementation libs.androidx.recyclerview
    implementation libs.androidx.swiperefreshlayout

    // Делаем разработку RecyclerView adapter'ов намного удобнее
    implementation libs.adapterdelegates4.kotlin.dsl

    // Логгирование
    implementation libs.timber

    // Навигация
    implementation libs.androidx.navigation.fragment.ktx
    implementation libs.androidx.navigation.ui.ktx

    // Анимации Android, использующие физику
    implementation libs.androidx.dynamicanimation

    //
    // Google Firebase
    // Подключаем Firebase BOM
    implementation platform('com.google.firebase:firebase-bom:32.7.2')

    // Библиотеки Remote Config и Analytics
    implementation 'com.google.firebase:firebase-config-ktx'
    implementation 'com.google.firebase:firebase-analytics-ktx'
    //

    // Сложные векторные анимации
    implementation libs.lottie

    // JSON
    implementation libs.gson

    // Работа с изображениями из сети
    implementation libs.glide
    ksp libs.compiler

    // Dependency Injection
    implementation dagger
    ksp daggerCompiler

    // Работа с базами данных - Room
    implementation libs.androidx.room.runtime
    implementation libs.androidx.room.rxjava3
    ksp libs.androidx.room.compiler

    // Многопоточность. Корутины
//    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-core:1.4.2'
//    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.4.2'
    // RxJava
    implementation libs.rxandroid
    implementation libs.rxjava

    // Тесты
    implementation libs.androidx.junit.ktx
    androidTestImplementation(libs.androidx.espresso.core)
    androidTestImplementation(libs.androidx.runner)
    androidTestImplementation(libs.androidx.rules)
}
